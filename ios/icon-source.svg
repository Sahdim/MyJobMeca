    </linearGradient>
    <radialGradient id="glowO" cx="0.88" cy="0.08" r="0.75">
      <stop offset="0" stop-color="#FF9F0A" stop-opacity=".55"/><stop offset="1" stop-color="#FF9F0A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.05" cy="0.98" r="0.7">
