name: MonJobMeca
options:
  bundleIdPrefix: com.sahdim
  deploymentTarget:
    iOS: "16.0"
targets:
  MonJobMeca:
    type: application
    platform: iOS
    sources:
      - path: MonJobMeca
      - path: ../donnees/offres.json
        buildPhase: resources
    info:
      path: MonJobMeca/Info.plist
      properties:
        CFBundleDisplayName: Job Méca
        CFBundleShortVersionString: "2.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: LaunchBg
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sahdim.monjobmeca
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "2.0"
        CURRENT_PROJECT_VERSION: "1"
