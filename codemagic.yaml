workflows:
  ios-ipa:
    name: Mon Job Meca iPhone
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
    scripts:
      - name: Installer XcodeGen
        script: brew install xcodegen
      - name: Generer le projet
        script: cd ios && xcodegen generate
      - name: Compiler sans signature
        script: |
          cd ios
          xcodebuild -project MonJobMeca.xcodeproj -scheme MonJobMeca -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Fabriquer le fichier ipa
        script: |
          cd ios
          rm -rf Payload && mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/MonJobMeca.app Payload/
          zip -qr ../MonJobMeca.ipa Payload
    artifacts:
      - MonJobMeca.ipa
